<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>З любов'ю!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff5f7;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }
        .container {
            padding: 20px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-gif {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo {
            max-width: 270px;
            margin-top: 20px;
            border-radius: 0;
            box-shadow: none;
        }
        h1 {
            color: #e91e63;
            font-size: 24px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. Гіфка зверху -->
        <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHRtNGFvdmkzbHRmZXU2cDc1dmthZWk5ZDJ0bnMyNjc0cGhhbDUwMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/bmMqDvlvvCSRGSbijm/giphy.gif>
        
        <!-- 2. Заголовок -->
        <h1>Дякуємо за ваше замовлення! ✨</h1>
        
        <!-- 3. Текст -->
        <p>Нехай ці квіти подарують вам щиру посмішку, а день буде наповнений теплом, ніжністю та приємними моментами.</p>
        
        <!-- 4. Ще більший логотип у самому низу -->
        <img src="logo.png" alt="Квіти ВаВ" class="logo">
    </div>
</body>
</html>
