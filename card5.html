<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>З любов'ю!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff5f7;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }
        .container {
            padding: 20px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-gif {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo {
            max-width: 160px;
            width: 100%;
            margin-top: 20px;
            border-radius: 0;
            box-shadow: none;
        }
        h1 {
            color: #e91e63;
            font-size: 24px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 15px;
        }
        .links-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .link-item {
            color: #e91e63;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 14px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 1px solid #ffe0e8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }
        .link-item:hover {
            background-color: #e91e63;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. Гіфка для третьої візитки -->
        <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2xma3dueHZscThiYXhwcTBoZHp1OXMzbzRsMDRyOW41NmwxYmpvaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/5xtDarvwVqEaz20yhOM/giphy.gif" alt="Романтична гіфка" class="main-gif">
        
        <!-- 2. Заголовок -->
        <h1>Для найдорожчої людини 💖</h1>
        
        <!-- 3. Текст -->
        <p>Ти — найкраще, що трапилося зі мною. Дякую за твою ніжність, турботу та моменти, поруч із якими зупиняється час.</p>
        
        <!-- 4. Логотип (160px) -->
        <img src="logo.png" alt="Квіти ВаВ" class="logo">

        <!-- 5. Посилання в один ряд -->
        <div class="links-row">
            <a href="https://instagram.com/flowers.vav" target="_blank" class="link-item">Instagram: @flowers.vav</a>
            <a href="https://vav.com.ua" target="_blank" class="link-item">Сайт: vav.com.ua</a>
        </div>
    </div>
</body>
</html>
